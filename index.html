<title>祝桂玲大美女 生日快乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8a0b4'/%3E%3Cpath d='M16 22c-4-3.2-7-5.6-7-8.4A3.6 3.6 0 0 1 16 11a3.6 3.6 0 0 1 7 2.6c0 2.8-3 5.2-7 8.4z' fill='%23fff'/%3E%3C/svg%3E">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a1210;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
  }

  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 62% center;
    z-index: 0;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(90deg, rgba(30, 18, 14, 0.42) 0%, rgba(30, 18, 14, 0.12) 38%, rgba(30, 18, 14, 0) 60%),
      linear-gradient(0deg, rgba(20, 12, 10, 0.35) 0%, rgba(20, 12, 10, 0) 30%);
    pointer-events: none;
  }

  .greeting {
    position: fixed;
    z-index: 3;
    left: 5%;
    top: 50%;
    transform: translateY(-50%);
    max-width: 44%;
    text-align: left;
    color: #fff;
    pointer-events: none;
    animation: rise 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
  }

  .greeting .eyebrow {
    font-family: "Great Vibes", "Noto Serif SC", cursive;
    font-size: clamp(20px, 3.4vw, 34px);
    color: #f6d9a6;
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
  }

  .greeting .line {
    font-weight: 900;
    line-height: 1.32;
    text-shadow: 0 3px 14px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.6);
  }

  .greeting .line.main {
    font-size: clamp(26px, 4.6vw, 42px);
    color: #fff;
  }

  .greeting .line.accent {
    font-size: clamp(30px, 5.4vw, 50px);
    color: #f7cf8f;
    margin-top: 6px;
    letter-spacing: 4px;
  }

  .greeting .divider {
    width: 56px;
    height: 2px;
    margin: 16px 0;
    background: linear-gradient(90deg, #f6d9a6, rgba(246,217,166,0));
  }

  .greeting .wish {
    font-size: clamp(13px, 1.9vw, 17px);
    font-weight: 600;
    color: rgba(255, 248, 238, 0.92);
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  .greeting .line.accent { animation: glow 3.2s ease-in-out infinite; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(-50% + 26px)); }
    to   { opacity: 1; transform: translateY(-50%); }
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 3px 14px rgba(0,0,0,0.55), 0 0 12px rgba(247, 207, 143, 0.25); }
    50%      { text-shadow: 0 3px 14px rgba(0,0,0,0.55), 0 0 26px rgba(247, 207, 143, 0.5); }
  }

  #petals {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .greeting { max-width: 52%; left: 6%; }
  }
</style>
</head>

  <section class="greeting" aria-label="生日祝福">
    <div class="eyebrow">Happy Birthday</div>
    <div class="line main">祝桂玲大美女</div>
    <div class="line accent">生日快乐</div>

  </section>

  <canvas id="petals"></canvas>

<script>
(function () {
  var canvas = document.getElementById('petals');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var petals = [];

  var COLORS = ['#f6c3d3', '#f9dce6', '#f3aec4', '#fff1f4', '#f7cf8f'];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makePetal(initial) {
    var size = 8 + Math.random() * 12;
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -30 - Math.random() * 60,
      size: size,
      speed: 0.5 + Math.random() * 0.9,
      swayAmp: 30 + Math.random() * 40,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.008 + Math.random() * 0.012,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.03,
      opacity: 0.45 + Math.random() * 0.4,
      color: COLORS[Math.floor(Math.random() * COLORS.length)]
    };
  }

  function init() {
    var count = Math.min(28, Math.round(W / 45));
    petals = [];
    for (var i = 0; i < count; i++) petals.push(makePetal(true));
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = p.color;
    var s = p.size;
    ctx.beginPath();
    ctx.moveTo(0, -s / 2);
    ctx.bezierCurveTo(s / 2, -s / 2, s / 2, s / 2, 0, s / 2);
    ctx.bezierCurveTo(-s / 2, s / 2, -s / 2, -s / 2, 0, -s / 2);
    ctx.fill();
    ctx.globalAlpha = p.opacity * 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(0, -s / 2 + 2);
    ctx.lineTo(0, s / 2 - 2);
    ctx.stroke();
    ctx.restore();
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      p.y += p.speed;
      p.swayPhase += p.swaySpeed;
      p.x += Math.sin(p.swayPhase) * 0.6;
      p.rot += p.rotSpeed;

      if (p.y > H + 30) petals[i] = makePetal(false);
      drawPetal(p);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', function () { resize(); init(); });
  resize();
  init();
  tick();
})();
</script>
